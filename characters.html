
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Characters | The Crimson and The Ashen</title>

    <style>
        * { box-sizing: border-box; }

        :root {
            --background: #0b0b0f;
            --panel: #111116;
            --crimson: crimson;
            --accent: #d34b65;
            --border: #302027;
            --muted: #aaa;
        }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            background: var(--background);
            color: white;
            font-family: Georgia, serif;
        }

        /* NAVIGATION */
        nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            padding: 22px 15px;
            background: #08080b;
            border-bottom: 1px solid var(--border);
        }

        nav a {
            color: #d9cdd0;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            transition: color 0.25s ease;
        }

        nav a:hover,
        nav a:focus-visible,
        nav a.active,
        nav a.selected {
            color: var(--crimson);
        }

        /* CHARACTER SECTION */
        #characters {
            padding: 45px 25px;
            animation: fadeSlideIn 0.6s ease both;
        }

        .section-heading {
            text-align: center;
            letter-spacing: 4px;
            margin: 0 0 35px;
        }

        .character-view {
            display: grid;
            grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
            gap: clamp(25px, 4vw, 55px);
            align-items: start;
            max-width: 1250px;
            margin: 0 auto;
        }

        /* ARTWORK */
        .art-panel {
            position: sticky;
            top: 24px;
            align-self: start;
            isolation: isolate;
            height: min(76vh, 760px);
            min-height: 520px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111116;
            border: 1px solid #302027;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .art-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.025);
        }

        .character-art {
            position: absolute;
            inset: 0;
            z-index: -2;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
            animation: artworkFadeIn 0.45s ease both;
        }

        .art-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(11,11,15,0.02) 35%,
                rgba(11,11,15,0.12) 48%,
                rgba(11,11,15,0.68) 70%,
                rgba(11,11,15,0.97) 100%
            );
        }

        .art-placeholder {
            position: absolute;
            inset: 0;
            z-index: -2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 25px;
            color: #777;
            text-align: center;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .art-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            padding: 35px clamp(20px, 3vw, 38px) 30px;
            pointer-events: none;
        }

        .overlay-number {
            color: #e07b8e;
            font-size: 11px;
            letter-spacing: 4px;
            margin: 0 0 12px;
        }

        .overlay-name {
            margin: 0 0 12px;
            color: #fff;
            font-size: clamp(30px, 3.2vw, 48px);
            line-height: 1.12;
            font-weight: normal;
            overflow-wrap: anywhere;
            text-shadow: 0 2px 18px rgba(0,0,0,0.7);
        }

        .overlay-title {
            margin: 0;
            color: #ed7189;
            font-size: clamp(10px, 1.1vw, 13px);
            line-height: 1.8;
            letter-spacing: 2px;
            overflow-wrap: anywhere;
        }

        .overlay-rank {
            display: inline-block;
            margin: 17px 0 0;
            padding: 7px 12px;
            border: 1px solid rgba(211,75,101,0.55);
            background: rgba(11,11,15,0.55);
            color: #eee;
            font-size: 12px;
            letter-spacing: 1.5px;
        }

        /* ORIGINAL ARTWORK SWITCH */
        .artwork-switch {
            position: absolute;
            z-index: 4;
            top: 16px;
            right: 16px;
            padding: 10px 13px;
            background: rgba(11,11,15,0.88);
            border: 1px solid #673044;
            color: #ed7189;
            font-family: Georgia, serif;
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .artwork-switch:hover {
            background: #d34b65;
            color: white;
        }

        /* CHARACTER INFORMATION */
        .character-details {
            padding: 10px 0 20px;
            min-width: 0;
        }

        .character-details > .character-number,
        .character-details > .character-name,
        .character-details > .character-title,
        .character-details > .character-rank,
        .character-details > .character-divider {
            display: none;
        }

        .profile-tabs {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 0;
            border-bottom: 1px solid #49232e;
        }

        .profile-tab {
            padding: 14px 13px;
            border: none;
            border-bottom: 2px solid transparent;
            background: transparent;
            color: #999;
            font-family: Georgia, serif;
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.3s, border-color 0.3s;
        }

        .profile-tab:hover { color: white; }

        .profile-tab.active {
            color: #e8758c;
            border-bottom-color: crimson;
        }

        .profile-tab:focus-visible,
        .arrow-button:focus-visible,
        .music-toggle:focus-visible {
            outline: 1px solid #d34b65;
            outline-offset: 4px;
        }

        .character-info {
            color: #bcbcc2;
            line-height: 1.9;
            font-size: 15px;
            overflow-wrap: anywhere;
            max-height: 68vh;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 10px 16px 20px 0;
            scrollbar-width: thin;
            scrollbar-color: #673044 #111116;
        }

        .character-info::-webkit-scrollbar { width: 6px; }
        .character-info::-webkit-scrollbar-track { background: #111116; }
        .character-info::-webkit-scrollbar-thumb {
            background: #673044;
            border-radius: 10px;
        }

        .character-info h3 {
            color: #d34b65;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .character-info p { margin: 12px 0; }
        .character-info strong { color: white; }
        .character-info ul { padding-left: 20px; }
        .character-info li { margin-bottom: 14px; }

        .ability-name {
            color: #e06a80;
            font-weight: bold;
        }

        /* QUICK INFO */
        .quick-info-list {
            list-style: none;
            padding: 0 !important;
        }

        .quick-info-list li {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #302027;
        }

        .quick-info-label {
            color: #d34b65;
            letter-spacing: 1px;
            font-size: 12px;
        }

        .quick-info-value {
            color: #eee;
            text-align: right;
        }

        /* SLIDESHOW CONTROLS */
        .slide-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
            margin: 35px auto 10px;
        }

        .arrow-button {
            width: 48px;
            height: 48px;
            border: 1px solid #673044;
            background: #141016;
            color: white;
            font-family: Georgia, serif;
            font-size: 28px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        .arrow-button:hover {
            background: crimson;
            border-color: crimson;
        }

        #slide-counter {
            color: #aaa;
            font-size: 13px;
            letter-spacing: 2px;
        }

        /* MUSIC PLAYER */
        .music-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            padding: 12px 18px;
            background: #111116;
            color: #d34b65;
            border: 1px solid #302027;
            border-radius: 8px;
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .music-toggle:hover {
            background: #d34b65;
            color: white;
        }

        /* ANIMATIONS */
        @keyframes artworkFadeIn {
            from { opacity: 0.35; }
            to { opacity: 1; }
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-out {
            animation: slideOut 0.2s ease forwards;
        }

        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(-20px);
            }
        }

        footer {
            margin-top: 80px;
            padding: 20px;
            color: #777;
            text-align: center;
            font-size: 13px;
            border-top: 1px solid var(--border);
        }

        /* MOBILE */
        @media (max-width: 700px) {
            nav {
                gap: 20px;
                padding: 20px 12px;
            }

            nav a {
                font-size: 11px;
                letter-spacing: 1.5px;
            }

            #characters { padding: 30px 18px; }

            .character-view {
                grid-template-columns: minmax(0, 1fr);
                gap: 25px;
            }

            .art-panel {
                position: relative;
                top: auto;
                height: min(68vh, 620px);
                min-height: 390px;
                max-height: 620px;
            }

            .art-overlay { padding: 30px 22px 23px; }

            .overlay-name { font-size: clamp(30px, 8vw, 43px); }
            .overlay-title { font-size: 11px; }

            .character-details {
                text-align: center;
                padding-top: 0;
            }

            .profile-tabs { justify-content: center; }

            .profile-tab {
                padding: 12px 9px;
                font-size: 10px;
            }

            .character-info {
                max-height: none;
                overflow: visible;
                padding: 10px 2px 20px;
                text-align: left;
            }

            .quick-info-value { text-align: left; }
            .quick-info-list li { justify-content: flex-start; }
            .slide-controls { margin-top: 25px; }
            footer { margin-top: 50px; }
        }

        @media (max-width: 380px) {
            .profile-tabs { gap: 0; }

            .profile-tab {
                padding: 12px 6px;
                font-size: 9px;
                letter-spacing: 0.5px;
            }

            .art-panel { min-height: 350px; }
            .overlay-title { letter-spacing: 1.2px; }

            .music-toggle {
                bottom: 12px;
                right: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

            "Rin Tomoe": {

                    <p>Rin Tomoe is the IV Grand Sovereign of the Yomi Sovereignty, a powerful fighter whose identity is shaped by family, painful truths, and the determination to keep moving forward. Known as The Bleeding Heart Sovereign, Rin carries a mysterious power connected to her heart, her blood, and the Abyss. Although her abilities can become terrifying, her story is not defined by power alone. Her resolve to fight for her people and her brother remains central to who she is. Behind the name Rin Tomoe lies another identity: Rinora Heartia T. Haslett.</p>

                    <p>Regina Voenitsumia Tomoe is the former Authority of Scarlet, also known as Obsidian Tide, of the Supreme Judgement Syndicate. Known as the Abyssal Queen, she once held a position of authority within the Syndicate before leaving it because of her relationship with King Deishreth Haslett IV of Eldoria. Regina is also the mother of Rin Tomoe and Jin Tomoe.</p>
                `,

        let currentCharacter = 0;
        let isAnimating = false;
        let showingOriginalArtwork = false;

        const characterContent = document.getElementById("character-content");
        const artPanel = document.getElementById("art-panel");

        const overlayNumber = document.getElementById("overlay-number");
        const overlayName = document.getElementById("overlay-name");
        const overlayTitle = document.getElementById("overlay-title");
        const overlayRank = document.getElementById("overlay-rank");

        const characterNumber = document.getElementById("character-number");
        const characterName = document.getElementById("character-name");
        const characterTitle = document.getElementById("character-title");
        const characterRank = document.getElementById("character-rank");

        const characterInfo = document.getElementById("character-info");
        const slideCounter = document.getElementById("slide-counter");

        const infoTab = document.getElementById("info-tab");
        const quickInfoTab = document.getElementById("quick-info-tab");
        const combatTab = document.getElementById("combat-tab");

        function showProfileTab(tabName) {
            const character = characterList[currentCharacter];
            const profile = profileData[character.name];

            const tabContent = {
                info: profile.info,
                quickInfo: profile.quickInfo,
                combat: profile.combat
            };

            const tabElements = {
                info: infoTab,
                quickInfo: quickInfoTab,
                combat: combatTab
            };

            if (!tabContent[tabName]) return;

            characterInfo.innerHTML = tabContent[tabName];

            Object.keys(tabElements).forEach(function(key) {
                const isActive = key === tabName;
                tabElements[key].classList.toggle("active", isActive);
                tabElements[key].setAttribute("aria-selected", String(isActive));
            });

            characterInfo.setAttribute("aria-labelledby", tabElements[tabName].id);
            characterInfo.scrollTop = 0;
        }

        infoTab.addEventListener("click", () => showProfileTab("info"));
        quickInfoTab.addEventListener("click", () => showProfileTab("quickInfo"));
        combatTab.addEventListener("click", () => showProfileTab("combat"));

        function displayArtwork(character) {
            artPanel.querySelectorAll(".character-art, .art-placeholder, .artwork-switch")
                .forEach(element => element.remove());

            const image = document.createElement("img");
            image.className = "character-art";

            const hasOriginal = Boolean(character.originalImage);
            const imageFile = showingOriginalArtwork && hasOriginal
                ? character.originalImage
                : character.image;

            image.src = imageFile;
            image.alt = showingOriginalArtwork && hasOriginal
                ? character.originalImageAlt
                : character.imageAlt;

            image.onerror = function() {
                if (!artPanel.contains(image)) return;
                image.remove();

                const placeholder = document.createElement("p");
                placeholder.className = "art-placeholder";
                placeholder.textContent =
                    "Could not load " + imageFile +
                    ". Check the filename and folder.";

                artPanel.insertBefore(
                    placeholder,
                    artPanel.querySelector(".art-overlay")
                );
            };

            artPanel.insertBefore(image, artPanel.querySelector(".art-overlay"));

            if (hasOriginal) {
                const switchButton = document.createElement("button");
                switchButton.type = "button";
                switchButton.className = "artwork-switch";
                switchButton.textContent = showingOriginalArtwork
                    ? "VIEW CURRENT ART"
                    : "VIEW ORIGINAL ART";

                switchButton.addEventListener("click", function() {
                    showingOriginalArtwork = !showingOriginalArtwork;
                    displayArtwork(character);
                });

                artPanel.appendChild(switchButton);
            }
        }

        function showCharacter(index) {
            const character = characterList[index];

            const formattedNumber =
                "CHARACTER " + String(index + 1).padStart(2, "0");

            characterNumber.textContent = formattedNumber;
            characterName.textContent = character.name;
            characterTitle.textContent = character.title;
            characterRank.textContent = character.rank;

            overlayNumber.textContent = formattedNumber;
            overlayName.textContent = character.name;
            overlayTitle.textContent = character.title;
            overlayRank.textContent = character.rank;

            showingOriginalArtwork = false;
            displayArtwork(character);
            showProfileTab("info");

            slideCounter.textContent =
                String(index + 1).padStart(2, "0") + " / " +
                String(characterList.length).padStart(2, "0");
        }

        function changeCharacter(direction) {
            if (isAnimating) return;

            isAnimating = true;
            characterContent.classList.add("slide-out");

            setTimeout(function() {
                currentCharacter =
                    (currentCharacter + direction + characterList.length) %
                    characterList.length;

                showCharacter(currentCharacter);

                characterContent.classList.remove("slide-out");
                characterContent.style.animation = "none";
                void characterContent.offsetWidth;
                characterContent.style.animation = "fadeSlideIn 0.5s ease both";

                isAnimating = false;
            }, 200);
        }

        document.getElementById("previous-button").addEventListener(
            "click", () => changeCharacter(-1)
        );

        document.getElementById("next-button").addEventListener(
            "click", () => changeCharacter(1)
        );

        // CHARACTERS PAGE MUSIC
        const charactersMusic = document.getElementById("charactersMusic");
        const musicToggle = document.getElementById("musicToggle");

        musicToggle.addEventListener("click", async function() {
            if (charactersMusic.paused) {
                try {
                    await charactersMusic.play();
                    musicToggle.textContent = "❚❚ Pause Music";
                    musicToggle.setAttribute("aria-pressed", "true");
                } catch (error) {
                    musicToggle.textContent = "▶ Play Music";
                    musicToggle.setAttribute("aria-pressed", "false");
                    alert("The music could not be played. Check that Embers beneath the sky.mp3 is uploaded beside characters.html.");
                }
            } else {
                charactersMusic.pause();
                musicToggle.textContent = "▶ Play Music";
                musicToggle.setAttribute("aria-pressed", "false");
            }
        });

        showCharacter(currentCharacter);
    </script>
